name: Publish to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for publishing (optional)'
        required: false
        default: 'Manual trigger'
  push:
    tags:
      - 'web-v*'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: windows-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (
        startsWith(github.ref, 'refs/tags/web-v') ||
        contains(github.event.head_commit.message, '[publish]')
      ))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: |
          cargo install wasm-pack

      - name: Build Projects
        shell: pwsh
        run: |
          .\.publish\publish.ps1 -Parallel

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs
          branch: gh-pages
          commit-message: >-
            Publish: 
            ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.reason || 
                github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && format('Tag {0}', github.ref_name) ||
                'Commit trigger' }}
            (from commit ${{ github.sha }})
          clean: true
