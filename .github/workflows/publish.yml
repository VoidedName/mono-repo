name: Publish to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for publishing (optional)'
        required: false
        default: 'Manual trigger'
  push:
    tags:
      - 'web-v*'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: windows-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (
        startsWith(github.ref, 'refs/tags/web-v') ||
        contains(github.event.head_commit.message, '[publish]')
      ))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: |
          $url = "https://github.com/rustwasm/wasm-pack/releases/download/v0.12.1/wasm-pack-v0.12.1-x86_64-pc-windows-msvc.tar.gz"
          $dest = "$env:USERPROFILE\.cargo\bin\wasm-pack.tar.gz"
          Invoke-WebRequest -Uri $url -OutFile $dest
          tar -xzf $dest -C "$env:USERPROFILE\.cargo\bin" --strip-components 1
          Remove-Item $dest
        shell: pwsh

      - name: Build Projects
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          .\.publish\publish.ps1 -Parallel

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs
          branch: gh-pages
          commit-message: >-
            Publish: 
            ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.reason || 
                github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && format('Tag {0}', github.ref_name) ||
                'Commit trigger' }}
            (from commit ${{ github.sha }})
          clean: true
